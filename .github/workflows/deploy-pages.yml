name: نشر محرك المستندات إلى GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: استنساخ المستودع
        uses: actions/checkout@v4
      - name: تهيئة pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: تهيئة Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: تثبيت الاعتمادات
        run: pnpm install --frozen-lockfile
      - name: بناء تطبيق Vite لمسار GitHub Pages
        run: GITHUB_PAGES=true pnpm exec vite build
      - name: تعطيل معالجة Jekyll
        run: touch dist/public/.nojekyll
      - name: رفع ناتج البناء
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: نشر الموقع
        id: deployment
        uses: actions/deploy-pages@v4

